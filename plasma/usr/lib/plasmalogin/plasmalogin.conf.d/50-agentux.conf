# AgentUX login screen (Plasma Login, Fedora 44's display manager).
#
# The greeter reads /etc/plasmalogin.conf.d/*, then the distribution defaults
# /usr/lib/plasmalogin/defaults.conf (Fedora's wallpaper, from
# kde-settings-plasmalogin), then this directory, then /etc/plasmalogin.conf;
# later files win. So this overrides Fedora's wallpaper, and System Settings >
# Login Screen (which writes /etc/plasmalogin.conf) still overrides this.
# The greeter's colours come from the global theme in /etc/xdg/kdeglobals.
[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/AgentUX/
PreviewImage=file:///usr/share/wallpapers/AgentUX/
