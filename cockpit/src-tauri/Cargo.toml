[package]
name = "agentux-cockpit"
version = "0.2.1"
description = "AgentUX cockpit: one interface over every coding-agent CLI"
authors = ["AgentUX contributors"]
license = "Apache-2.0"
repository = "https://github.com/agentux-os/agentux-desktop"
edition = "2021"
# tauri 2.12 and its crates (tauri-build, tauri-utils, tray-icon, ...) need 1.90.
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time"] }

# Meta+A and the login autostart both run `agentux-cockpit`; this turns every
# launch after the first into "bring the existing window forward".
[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "time", "macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
