[package]
name = "agentux-office"
version = "0.1.0"
description = "AgentUX Office for the desktop: the Office of an AgentUX Command server"
authors = ["AgentUX contributors"]
license = "Apache-2.0"
repository = "https://github.com/agentux-os/agentux-desktop"
edition = "2021"
# tauri 2.12 and its crates need 1.90.
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GET /v1/instance, to check a server before opening it.
ureq = "3"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
