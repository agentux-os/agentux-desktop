# Builds COSMIC's computed themes from their builders, with libcosmic's own
# code (theme.sh runs it). Not part of the cockpit's build.
[package]
name = "agentux-cosmic-theme-gen"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The libcosmic revision Fedora 44's cosmic-settings (epoch-1.10.0; theme.sh checks the versions match) is built
# from, so the themes come out the way Fedora's own defaults were made.
cosmic-config = { git = "https://github.com/pop-os/libcosmic", rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170", default-features = false, features = ["macro"] }
cosmic-theme = { git = "https://github.com/pop-os/libcosmic", rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170", default-features = false }
