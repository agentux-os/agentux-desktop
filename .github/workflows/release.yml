name: release

# Builds the cockpit as an RPM for the AgentUX image (Fedora Kinoite 44).
# The build runs inside a Fedora 44 container so the binary links against the
# same webkit2gtk4.1 / gtk3 / glibc the image ships, not Ubuntu's.
#
# The x86_64 job also packs common, Plasma, and COSMIC install roots into
# deterministic, checksummed build-input archives. The RPM identity remains
# agentux-cockpit; desktop composition is represented by the archive names.
#
# The RPM is built for x86_64 and aarch64, each natively on a runner of that
# architecture (GitHub's arm64 runners are free for public repositories), from
# the same multi-arch fedora:44 image, and each is install-checked in a fresh
# container of its arch. The desktop bundles are architecture-independent, so
# only the x86_64 leg builds them.
#
# - push of a `v*` tag: build and attach both .rpm files and all three bundles
#   (+ .sha256 sidecars) to a GitHub release for that tag
# - workflow_dispatch: build and upload them as workflow artifacts only
#   (agentux-cockpit-rpm-x86_64, agentux-cockpit-rpm-aarch64,
#   agentux-desktop-bundles)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rpm:
    name: rpm (fedora 44, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            bundles: true
          - arch: aarch64
            runner: ubuntu-24.04-arm
            bundles: false
    runs-on: ${{ matrix.runner }}
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      # Installed before checkout so actions/checkout can use git.
      - name: Install build dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            git nodejs npm rust cargo gcc gcc-c++ make pkgconf-pkg-config \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel \
            librsvg2-devel file rpm cpio desktop-file-utils jq \
            libxml2 findutils tar gzip
          rustc --version
          node --version

      - uses: actions/checkout@v7

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: cockpit
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${app_version}"
            exit 1
          fi

      - name: Check common bundle
        if: matrix.bundles
        run: common/check.sh

      - name: Check Plasma overlay
        if: matrix.bundles
        run: plasma/check.sh

      - name: Check COSMIC overlay
        if: matrix.bundles
        run: cosmic/check.sh

      # Deterministic: sorted entries, root ownership, file times from the commit
      # and a gzip header without name/timestamp, so a rebuild of the same commit
      # gives the same bytes.
      - name: Build desktop bundles
        if: matrix.bundles
        id: bundles
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(node -p "require('./cockpit/src-tauri/tauri.conf.json').version")
          commit_time=$(git log -1 --format=%ct)
          mkdir -p dist
          for bundle in common plasma cosmic; do
            archive="dist/agentux-desktop-${bundle}-${version}.tar.gz"
            tar -C "$bundle" --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${commit_time}" --mode='u+rwX,go+rX,go-w' \
              -cf - usr etc | gzip -9n > "$archive"
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
            if tar -tzf "$archive" | grep -vE '^(usr|etc)(/|$)'; then
              echo "::error::unexpected paths in $archive"
              exit 1
            fi
            echo "built $archive"
          done
          for overlay in plasma cosmic; do
            collision=$(comm -12 \
              <(tar -tzf "dist/agentux-desktop-common-${version}.tar.gz" | sed '/\/$/d' | LC_ALL=C sort) \
              <(tar -tzf "dist/agentux-desktop-${overlay}-${version}.tar.gz" | sed '/\/$/d' | LC_ALL=C sort))
            if [[ -n "$collision" ]]; then
              echo "::error::common/${overlay} bundle path collision: $collision"
              exit 1
            fi
          done
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo '### Desktop configuration bundles'
            echo '```'
            ls -l dist
            for archive in dist/agentux-desktop-*.tar.gz; do
              cat "${archive}.sha256"
              tar -tvzf "$archive"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! tar -tvzf "dist/agentux-desktop-common-${version}.tar.gz" | grep -qE '^-rwxr-xr-x .* usr/libexec/agentux-cockpit-autostart$'; then
            echo "::error::common autostart wrapper is not executable in its bundle"
            exit 1
          fi

      - name: Install npm dependencies
        working-directory: cockpit
        run: npm ci

      - name: Build RPM
        working-directory: cockpit
        run: npx tauri build --ci --bundles rpm -- --locked

      # Signed with the AgentUX RPM key when the secret exists
      # (agentux-core docs/releasing.md); the public key travels with it.
      - name: Sign RPM
        env:
          AGENTUX_RPM_SIGNING_KEY: ${{ secrets.AGENTUX_RPM_SIGNING_KEY }}
          AGENTUX_RPM_SIGNING_PASSPHRASE: ${{ secrets.AGENTUX_RPM_SIGNING_PASSPHRASE }}
        run: sh .github/scripts/sign-rpms.sh cockpit/src-tauri/target/release/bundle/rpm/*.${{ matrix.arch }}.rpm

      - name: Inspect RPM
        id: rpm
        run: |
          rpm_path=$(ls cockpit/src-tauri/target/release/bundle/rpm/*.${{ matrix.arch }}.rpm)
          echo "path=${rpm_path}" >> "$GITHUB_OUTPUT"
          ls -l "${rpm_path}"
          rpm -qip "${rpm_path}"
          rpm -qlp "${rpm_path}"
          rpm -qp --requires "${rpm_path}"
          mkdir -p /tmp/rpm-root
          (cd /tmp/rpm-root && rpm2cpio "${GITHUB_WORKSPACE}/${rpm_path}" | cpio -idm --quiet)
          cat /tmp/rpm-root/usr/share/applications/agentux-cockpit.desktop
          desktop-file-validate /tmp/rpm-root/usr/share/applications/agentux-cockpit.desktop
          {
            echo '### RPM'
            echo '```'
            ls -lh "${rpm_path}"
            rpm -qip "${rpm_path}"
            echo
            rpm -qlp "${rpm_path}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentux-cockpit-rpm-${{ matrix.arch }}
          path: |
            ${{ steps.rpm.outputs.path }}
            cockpit/src-tauri/target/release/bundle/rpm/RPM-GPG-KEY-agentux
          if-no-files-found: error

      - name: Upload desktop bundle artifacts
        if: matrix.bundles
        uses: actions/upload-artifact@v7
        with:
          name: agentux-desktop-bundles
          path: dist/agentux-desktop-*.tar.gz*
          if-no-files-found: error

  # Installs each RPM with dnf in a fresh fedora:44 container of its own arch
  # and checks that every shared library the binary needs resolves.
  verify:
    name: verify rpm (fedora 44, ${{ matrix.arch }})
    needs: rpm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agentux-cockpit-rpm-${{ matrix.arch }}

      - name: Check the signature
        run: |
          rpm_file=$(ls agentux-cockpit-*.${{ matrix.arch }}.rpm)
          if [ -f RPM-GPG-KEY-agentux ]; then
            rpm --import RPM-GPG-KEY-agentux
            rpm -K "$rpm_file" | tee /dev/stderr | grep -q 'signatures OK'
          else
            echo "::warning::$rpm_file is not signed"
          fi

      - name: Install with dnf
        run: |
          rpm_file=$(ls agentux-cockpit-*.${{ matrix.arch }}.rpm)
          dnf -y install --setopt=install_weak_deps=False "./${rpm_file}"
          test "$(rpm -q --qf '%{ARCH}' agentux-cockpit)" = "${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Check installed files
        run: |
          test -x /usr/bin/agentux-cockpit
          test -f /usr/share/applications/agentux-cockpit.desktop
          if ldd /usr/bin/agentux-cockpit | grep 'not found'; then
            echo "::error::unresolved shared libraries"
            exit 1
          fi
          {
            echo '### Installed RPM'
            echo '```'
            rpm -qi agentux-cockpit
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rpm, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release on tag pushes
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: agentux-*
          merge-multiple: true

      # prerelease: "true" for tags like v0.2.0-rc.1. Otherwise the input is left
      # empty, which action-gh-release treats as unset: a new release is created
      # as a normal release, and a release that already exists (e.g. created by
      # hand as a pre-release) keeps its own prerelease flag instead of being
      # flipped to false.
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            agentux-cockpit-*.x86_64.rpm
            agentux-cockpit-*.aarch64.rpm
            agentux-desktop-common-*.tar.gz
            agentux-desktop-common-*.tar.gz.sha256
            agentux-desktop-plasma-*.tar.gz
            agentux-desktop-plasma-*.tar.gz.sha256
            agentux-desktop-cosmic-*.tar.gz
            agentux-desktop-cosmic-*.tar.gz.sha256
          prerelease: ${{ contains(github.ref_name, '-') && 'true' || '' }}
          fail_on_unmatched_files: true

      # The public key, once the RPMs are signed.
      - if: hashFiles('RPM-GPG-KEY-agentux') != ''
        uses: softprops/action-gh-release@v3
        with:
          files: RPM-GPG-KEY-agentux
