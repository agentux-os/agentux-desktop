name: release

# Builds the cockpit as an RPM for the AgentUX image (Fedora Kinoite 44).
# The build runs inside a Fedora 44 container so the binary links against the
# same webkit2gtk4.1 / gtk3 / glibc the image ships, not Ubuntu's.
#
# The same job packs the Plasma defaults overlay (plasma/usr and plasma/etc)
# into agentux-plasma-<version>.tar.gz, paths relative to /, so the image build
# can `tar -xz -C /` it next to the RPM under one version number.
#
# The RPM is built for x86_64 and aarch64, each natively on a runner of that
# architecture (GitHub's arm64 runners are free for public repositories), from
# the same multi-arch fedora:44 image, and each is install-checked in a fresh
# container of its arch. The plasma tarball is arch-independent, so only the
# x86_64 leg builds it.
#
# - push of a `v*` tag: build and attach both .rpm files and the plasma tarball
#   (+ .sha256) to a GitHub release for that tag
# - workflow_dispatch: build and upload them as workflow artifacts only
#   (agentux-cockpit-rpm-x86_64, agentux-cockpit-rpm-aarch64,
#   agentux-plasma-tarball)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rpm:
    name: rpm (fedora 44, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            plasma: true
          - arch: aarch64
            runner: ubuntu-24.04-arm
            plasma: false
    runs-on: ${{ matrix.runner }}
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      # Installed before checkout so actions/checkout can use git.
      - name: Install build dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            git nodejs npm rust cargo gcc gcc-c++ make pkgconf-pkg-config \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel \
            librsvg2-devel file rpm cpio desktop-file-utils \
            libxml2 findutils tar gzip
          rustc --version
          node --version

      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: cockpit
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${app_version}"
            exit 1
          fi

      - name: Check plasma overlay
        if: matrix.plasma
        run: plasma/check.sh

      # Deterministic: sorted entries, root ownership, file times from the commit
      # and a gzip header without name/timestamp, so a rebuild of the same commit
      # gives the same bytes.
      - name: Build plasma tarball
        if: matrix.plasma
        id: plasma
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(node -p "require('./cockpit/src-tauri/tauri.conf.json').version")
          commit_time=$(git log -1 --format=%ct)
          mkdir -p dist
          tarball="dist/agentux-plasma-${version}.tar.gz"
          tar -C plasma --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${commit_time}" --mode='u+rwX,go+rX,go-w' \
            -cf - usr etc | gzip -9n > "${tarball}"
          (cd dist && sha256sum "$(basename "${tarball}")" > "$(basename "${tarball}").sha256")
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=${tarball}.sha256" >> "$GITHUB_OUTPUT"
          {
            echo '### Plasma overlay tarball'
            echo '```'
            ls -l dist
            cat "${tarball}.sha256"
            echo
            tar -tvzf "${tarball}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Only usr/ and etc/ may be in it (no check.sh, nothing under a home).
          if tar -tzf "${tarball}" | grep -vE '^(usr|etc)(/|$)'; then
            echo "::error::unexpected paths in ${tarball}"
            exit 1
          fi
          # The cockpit autostart wrapper must stay executable.
          if ! tar -tvzf "${tarball}" | grep -qE '^-rwxr-xr-x .* usr/libexec/agentux-cockpit-autostart$'; then
            echo "::error::usr/libexec/agentux-cockpit-autostart is not executable in ${tarball}"
            exit 1
          fi

      - name: Install npm dependencies
        working-directory: cockpit
        run: npm ci

      - name: Build RPM
        working-directory: cockpit
        run: npx tauri build --ci --bundles rpm -- --locked

      - name: Inspect RPM
        id: rpm
        run: |
          rpm_path=$(ls cockpit/src-tauri/target/release/bundle/rpm/*.${{ matrix.arch }}.rpm)
          echo "path=${rpm_path}" >> "$GITHUB_OUTPUT"
          ls -l "${rpm_path}"
          rpm -qip "${rpm_path}"
          rpm -qlp "${rpm_path}"
          rpm -qp --requires "${rpm_path}"
          mkdir -p /tmp/rpm-root
          (cd /tmp/rpm-root && rpm2cpio "${GITHUB_WORKSPACE}/${rpm_path}" | cpio -idm --quiet)
          cat /tmp/rpm-root/usr/share/applications/agentux-cockpit.desktop
          desktop-file-validate /tmp/rpm-root/usr/share/applications/agentux-cockpit.desktop
          {
            echo '### RPM'
            echo '```'
            ls -lh "${rpm_path}"
            rpm -qip "${rpm_path}"
            echo
            rpm -qlp "${rpm_path}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentux-cockpit-rpm-${{ matrix.arch }}
          path: ${{ steps.rpm.outputs.path }}
          if-no-files-found: error

      - name: Upload plasma tarball artifact
        if: matrix.plasma
        uses: actions/upload-artifact@v4
        with:
          name: agentux-plasma-tarball
          path: |
            ${{ steps.plasma.outputs.tarball }}
            ${{ steps.plasma.outputs.sha256 }}
          if-no-files-found: error

  # Installs each RPM with dnf in a fresh fedora:44 container of its own arch
  # and checks that every shared library the binary needs resolves.
  verify:
    name: verify rpm (fedora 44, ${{ matrix.arch }})
    needs: rpm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentux-cockpit-rpm-${{ matrix.arch }}

      - name: Install with dnf
        run: |
          rpm_file=$(ls agentux-cockpit-*.${{ matrix.arch }}.rpm)
          dnf -y install --setopt=install_weak_deps=False "./${rpm_file}"
          test "$(rpm -q --qf '%{ARCH}' agentux-cockpit)" = "${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Check installed files
        run: |
          test -x /usr/bin/agentux-cockpit
          test -f /usr/share/applications/agentux-cockpit.desktop
          if ldd /usr/bin/agentux-cockpit | grep 'not found'; then
            echo "::error::unresolved shared libraries"
            exit 1
          fi
          {
            echo '### Installed RPM'
            echo '```'
            rpm -qi agentux-cockpit
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rpm, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release on tag pushes
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agentux-*
          merge-multiple: true

      # prerelease: "true" for tags like v0.2.0-rc.1. Otherwise the input is left
      # empty, which action-gh-release treats as unset: a new release is created
      # as a normal release, and a release that already exists (e.g. created by
      # hand as a pre-release) keeps its own prerelease flag instead of being
      # flipped to false.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agentux-cockpit-*.x86_64.rpm
            agentux-cockpit-*.aarch64.rpm
            agentux-plasma-*.tar.gz
            agentux-plasma-*.tar.gz.sha256
          prerelease: ${{ contains(github.ref_name, '-') && 'true' || '' }}
          fail_on_unmatched_files: true
