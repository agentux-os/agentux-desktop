name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@v7

      - name: Check desktop bundle layout
        working-directory: .
        run: node tests/desktop-bundles-contract.mjs

      - name: Check release artifact contract
        working-directory: .
        run: node tests/release-contract.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cockpit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (daemon adapter)
        run: npm test

      - name: Build frontend
        run: npx vite build

      # System libraries Tauri 2 needs on Linux (https://v2.tauri.app/start/prerequisites/#linux)
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install the pinned toolchain (src-tauri/rust-toolchain.toml)
        working-directory: cockpit/src-tauri
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cockpit/src-tauri

      - name: Cargo check (Tauri shell)
        working-directory: cockpit/src-tauri
        run: cargo check --locked

      - name: Cargo test (daemon socket client)
        working-directory: cockpit/src-tauri
        run: cargo test --locked

      # Known vulnerabilities in what the cockpit ships: npm packages that
      # reach the bundle (not dev tools), and the Tauri shell's crates.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  deny:
    name: dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: cockpit/src-tauri/Cargo.toml
          command: check advisories sources

  plasma:
    name: plasma overlay
    runs-on: ubuntu-latest
    # Same distribution as the image, so desktop-file-validate matches the
    # version that ships with Kinoite.
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v7

      - name: Install check tools
        # util-linux: setpriv, so check.sh can run the cockpit autostart wrapper
        # as a system user and as a regular user.
        # qt6-qtdeclarative-devel: qmllint, for the login splash QML.
        run: dnf -y install --setopt=install_weak_deps=False desktop-file-utils nodejs libxml2 findutils grep sed util-linux qt6-qtdeclarative-devel jq

      - name: Check plasma overlay
        run: plasma/check.sh

      - name: Check shared desktop overlay
        run: |
          node common/check.mjs
          bash -n common/usr/libexec/agentux-setup
          sh -n common/usr/libexec/agentux-cockpit-autostart
          desktop-file-validate common/usr/share/applications/agentux-welcome.desktop
          desktop-file-validate common/etc/xdg/autostart/agentux-welcome.desktop common/etc/xdg/autostart/agentux-cockpit.desktop

      - name: Check COSMIC overlay
        run: node cosmic/check.mjs

      # The overlay hooks into files and plugin ids of Fedora 44 packages
      # (plasma-welcome's kded module, Plasma Login's drop-in directory). Fail
      # if a package update moves them, and make sure no overlay file replaces
      # a file a Fedora package owns (the image build would silently overwrite it).
      - name: Check Fedora 44 paths the overlay relies on
        shell: bash
        run: |
          set -euo pipefail
          owners() { dnf -q repoquery --whatprovides "$1" 2>/dev/null || true; }
          ok=1
          for path in \
              /usr/lib64/qt6/plugins/kf6/kded/kded_plasma_welcome.so \
              /usr/lib/plasmalogin/plasmalogin.conf.d \
              /usr/lib/plasmalogin/defaults.conf; do
            if [ -n "$(owners "$path")" ]; then
              echo "ok: $path ($(owners "$path" | head -n 1))"
            else
              echo "::error::no Fedora 44 package ships $path"; ok=0
            fi
          done
          while IFS= read -r file; do
            owner=$(owners "/$file" | head -n 1)
            if [ -n "$owner" ]; then
              echo "::error::overlay file /$file is owned by $owner"; ok=0
            else
              echo "ok: /$file is not owned by a package"
            fi
          done < <(cd plasma && find usr etc -type f | sort)
          [ "$ok" = 1 ]

  common:
    name: common bundle
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v7
      - name: Install check tools
        run: dnf -y install --setopt=install_weak_deps=False nodejs desktop-file-utils
      - name: Check common bundle
        run: common/check.sh

  cosmic:
    name: COSMIC overlay
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v7
      - name: Install check tools
        run: dnf -y install --setopt=install_weak_deps=False nodejs
      - name: Check COSMIC overlay
        run: cosmic/check.sh

      # The computed themes COSMIC reads are generated from the builders by
      # libcosmic (tools/cosmic-theme/theme.sh). When they are out of date, the job keeps
      # the up-to-date files as an artifact to commit.
      - name: Install the theme generator's tools
        run: dnf -y install --setopt=install_weak_deps=False cargo rust cpio diffutils git-core 'dnf-command(download)'
      - name: Check the COSMIC themes
        id: themes
        run: tools/cosmic-theme/theme.sh
      - name: Regenerate the COSMIC themes
        if: failure() && steps.themes.outcome == 'failure'
        run: tools/cosmic-theme/theme.sh --write || true
      - name: Keep the regenerated themes
        if: failure() && steps.themes.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: cosmic-themes
          path: |
            cosmic/usr/share/cosmic/com.system76.CosmicTheme.Dark
            cosmic/usr/share/cosmic/com.system76.CosmicTheme.Light
            tools/cosmic-theme/Cargo.lock

      # COSMIC reads a component's system defaults from the first data
      # directory that has it, so AgentUX's defaults have to replace the
      # files Fedora's COSMIC packages install. Every replacement is listed
      # here: fail if an overlay file replaces a packaged file that is not
      # listed, or if a listed file is no longer packaged (a moved path
      # would leave the default silently unapplied).
      - name: Check the Fedora 44 files the overlay replaces
        shell: bash
        run: |
          set -euo pipefail
          owners() { dnf -q repoquery --whatprovides "$1" 2>/dev/null || true; }
          replaces=(
            /usr/share/cosmic/com.system76.CosmicBackground/v1/all
            /usr/share/cosmic/com.system76.CosmicAppList/v1/favorites
            /usr/share/cosmic/com.system76.CosmicTheme.Dark.Builder/v2/accent
            /usr/share/cosmic/com.system76.CosmicTheme.Light.Builder/v2/accent
          )
          ok=1
          for path in "${replaces[@]}"; do
            [ -f "cosmic$path" ] || { echo "::error::$path is listed but not in the overlay"; ok=0; }
            if [ -n "$(owners "$path")" ]; then
              echo "ok: replaces $path ($(owners "$path" | head -n 1))"
            else
              echo "::error::no Fedora 44 package ships $path any more"; ok=0
            fi
          done
          while IFS= read -r file; do
            case " ${replaces[*]} " in *" /$file "*) continue ;; esac
            # The computed themes replace cosmic-settings' key by key; the
            # step "Check the COSMIC themes" vouches for each of them.
            case "/$file" in /usr/share/cosmic/com.system76.CosmicTheme.Dark/v2/*|/usr/share/cosmic/com.system76.CosmicTheme.Light/v2/*)
              echo "ok: generated theme file /$file ($(owners "/$file" | head -n 1))"; continue ;;
            esac
            owner=$(owners "/$file" | head -n 1)
            if [ -n "$owner" ]; then
              echo "::error::overlay file /$file is owned by $owner and not listed as a replacement"; ok=0
            else
              echo "ok: /$file is not owned by a package"
            fi
          done < <(cd cosmic && find usr etc -type f 2>/dev/null | sort)
          # The dock pins apps by desktop file id; an id no package ships
          # (Fedora's Firefox is org.mozilla.firefox, not firefox) leaves a
          # hole in the dock. agentux-cockpit comes from the cockpit RPM.
          while IFS= read -r app; do
            [ "$app" = agentux-cockpit ] && continue
            path=/usr/share/applications/$app.desktop
            if [ -n "$(owners "$path")" ]; then
              echo "ok: dock app $app ($(owners "$path" | head -n 1))"
            else
              echo "::error::the dock pins $app, but no Fedora 44 package ships $path"; ok=0
            fi
          done < <(grep -o '"[^"]*"' cosmic/usr/share/cosmic/com.system76.CosmicAppList/v1/favorites | tr -d '"')
          [ "$ok" = 1 ]
