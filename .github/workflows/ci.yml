name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cockpit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (daemon adapter)
        run: npm test

      - name: Build frontend
        run: npx vite build

      # System libraries Tauri 2 needs on Linux (https://v2.tauri.app/start/prerequisites/#linux)
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cockpit/src-tauri

      - name: Cargo check (Tauri shell)
        working-directory: cockpit/src-tauri
        run: cargo check --locked

      - name: Cargo test (daemon socket client)
        working-directory: cockpit/src-tauri
        run: cargo test --locked

  plasma:
    name: plasma overlay
    runs-on: ubuntu-latest
    # Same distribution as the image, so desktop-file-validate matches the
    # version that ships with Kinoite.
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install check tools
        run: dnf -y install --setopt=install_weak_deps=False desktop-file-utils nodejs libxml2 findutils grep sed

      - name: Check plasma overlay
        run: plasma/check.sh
