name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cockpit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (daemon adapter)
        run: npm test

      - name: Build frontend
        run: npx vite build

      # System libraries Tauri 2 needs on Linux (https://v2.tauri.app/start/prerequisites/#linux)
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cockpit/src-tauri

      - name: Cargo check (Tauri shell)
        working-directory: cockpit/src-tauri
        run: cargo check --locked

      - name: Cargo test (daemon socket client)
        working-directory: cockpit/src-tauri
        run: cargo test --locked

  plasma:
    name: plasma overlay
    runs-on: ubuntu-latest
    # Same distribution as the image, so desktop-file-validate matches the
    # version that ships with Kinoite.
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install check tools
        # util-linux: setpriv, so check.sh can run the cockpit autostart wrapper
        # as a system user and as a regular user.
        run: dnf -y install --setopt=install_weak_deps=False desktop-file-utils nodejs libxml2 findutils grep sed util-linux

      - name: Check plasma overlay
        run: plasma/check.sh

      # The overlay hooks into files and plugin ids of Fedora 44 packages
      # (plasma-welcome's kded module, Plasma Login's drop-in directory). Fail
      # if a package update moves them, and make sure no overlay file replaces
      # a file a Fedora package owns (the image build would silently overwrite it).
      - name: Check Fedora 44 paths the overlay relies on
        shell: bash
        run: |
          set -euo pipefail
          owners() { dnf -q repoquery --whatprovides "$1" 2>/dev/null || true; }
          ok=1
          for path in \
              /usr/lib64/qt6/plugins/kf6/kded/kded_plasma_welcome.so \
              /usr/lib/plasmalogin/plasmalogin.conf.d \
              /usr/lib/plasmalogin/defaults.conf; do
            if [ -n "$(owners "$path")" ]; then
              echo "ok: $path ($(owners "$path" | head -n 1))"
            else
              echo "::error::no Fedora 44 package ships $path"; ok=0
            fi
          done
          while IFS= read -r file; do
            owner=$(owners "/$file" | head -n 1)
            if [ -n "$owner" ]; then
              echo "::error::overlay file /$file is owned by $owner"; ok=0
            else
              echo "ok: /$file is not owned by a package"
            fi
          done < <(cd plasma && find usr etc -type f | sort)
          [ "$ok" = 1 ]
