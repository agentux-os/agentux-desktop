# Weekly dependency updates: the cockpit's npm packages, the Tauri shell's
# crates and the GitHub Actions CI uses.
version: 2
updates:
  - package-ecosystem: npm
    directory: /cockpit
    schedule:
      interval: weekly
    ignore:
      # Node's types follow the Node the cockpit runs on (22), not lead it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /cockpit/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
